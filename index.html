<script>
document.querySelectorAll('.laco').forEach(fig => {
  const q = JSON.parse(fig.dataset.quadros), img = fig.querySelector('img'), faixa = fig.querySelector('input'),
        botao = fig.querySelector('.tocar'), vel = fig.querySelector('select'), rot = fig.querySelector('output');
  let i = q.length - 1, timer = null;
  const mostrar = n => { i = (n + q.length) % q.length; img.src = q[i].src; faixa.value = i; rot.textContent = q[i].rotulo;
    new Image().src = q[(i + 1) % q.length].src; };
  const parar = () => { clearInterval(timer); timer = null; botao.textContent = '▶'; botao.setAttribute('aria-label', 'Tocar'); };
  const tocar = () => { parar(); timer = setInterval(() => mostrar(i + 1), +vel.value); botao.textContent = '❚❚';
    botao.setAttribute('aria-label', 'Pausar'); };
  botao.addEventListener('click', () => timer ? parar() : tocar());
  faixa.addEventListener('input', () => { parar(); mostrar(+faixa.value); });
  vel.addEventListener('change', () => { if (timer) tocar(); });
  fig.querySelector('.quadro').addEventListener('click', () => timer ? parar() : tocar());
});
</script>
