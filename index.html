<style>
:root { --fundo: #f6f7f9; --superficie: #fff; --texto: #1b1f24; --suave: #5b6470; --borda: #dde1e6;
  --destaque: #0b6bcb; --quadro: #0e1116; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fundo: #0e1116; --superficie: #171b21;
  --texto: #e6e9ed; --suave: #9aa4b0; --borda: #2a3038; --destaque: #5aa9ff; } }
:root[data-theme="dark"] { --fundo: #0e1116; --superficie: #171b21; --texto: #e6e9ed; --suave: #9aa4b0;
  --borda: #2a3038; --destaque: #5aa9ff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
header, main { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 32px; padding-bottom: 16px; }
h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.1rem); }
header p { margin: 0; color: var(--suave); }
main { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); padding-bottom: 40px; }
.cartao { margin: 0; background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
.quadro { background: var(--quadro); display: flex; justify-content: center; cursor: pointer; }
.quadro img { display: block; max-width: 100%; max-height: 75vh; height: auto; }
.controles { display: flex; gap: 10px; align-items: center; padding: 10px 14px 0; flex-wrap: wrap; }
.controles input { flex: 1 1 180px; accent-color: var(--destaque); }
.controles button, .controles select { font: inherit; color: var(--texto); background: var(--fundo);
  border: 1px solid var(--borda); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.controles button { min-width: 44px; }
.controles output { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--suave); }
figcaption { padding: 10px 14px 14px; }
figcaption h2 { margin: 0 0 2px; font-size: 1.05rem; }
figcaption p { margin: 0; color: var(--suave); font-size: 0.9rem; }
.vazio { padding: 40px 16px; color: var(--suave); text-align: center; }
footer { max-width: 1200px; margin: 0 auto; padding: 16px 16px 32px; color: var(--suave); font-size: 0.85rem; }
</style>

<footer>Atualizado em 19/11/2026 20:07 local (23:07 UTC). Fonte: Defesa Civil de SC.</footer>
<script>
document.querySelectorAll('.laco').forEach(fig => {
  const q = JSON.parse(fig.dataset.quadros), img = fig.querySelector('img'), faixa = fig.querySelector('input'),
        botao = fig.querySelector('.tocar'), vel = fig.querySelector('select'), rot = fig.querySelector('output');
  let i = q.length - 1, timer = null;
  const mostrar = n => { i = (n + q.length) % q.length; img.src = q[i].src; faixa.value = i; rot.textContent = q[i].rotulo;
    new Image().src = q[(i + 1) % q.length].src; };
  const parar = () => { clearInterval(timer); timer = null; botao.textContent = '▶'; botao.setAttribute('aria-label', 'Tocar'); };
  const tocar = () => { parar(); timer = setInterval(() => mostrar(i + 1), +vel.value); botao.textContent = '❚❚';
    botao.setAttribute('aria-label', 'Pausar'); };
  botao.addEventListener('click', () => timer ? parar() : tocar());
  faixa.addEventListener('input', () => { parar(); mostrar(+faixa.value); });
  vel.addEventListener('change', () => { if (timer) tocar(); });
  fig.querySelector('.quadro').addEventListener('click', () => timer ? parar() : tocar());
});
</script>
